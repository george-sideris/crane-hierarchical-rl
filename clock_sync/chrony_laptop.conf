# Chrony additions for the LAPTOP (172.20.230.162) - NTP server for the crane LAN.
#
# Append these lines to /etc/chrony/chrony.conf (keep the existing pool/server
# lines so the laptop still syncs to the internet when it has a connection):
#
#   sudo sh -c 'cat chrony_laptop.conf >> /etc/chrony/chrony.conf'
#   sudo systemctl restart chrony

# Serve time to the crane LAN (perception kit box and anything else on it).
allow 172.20.0.0/16

# Keep serving even when the laptop itself has no internet reference
# (e.g. in the lab): act as a local clock at a low stratum.
local stratum 10
