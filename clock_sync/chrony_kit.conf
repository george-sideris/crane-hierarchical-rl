# Chrony config for the PERCEPTION KIT box (172.20.230.118).
#
# Replace the pool/server lines in /etc/chrony/chrony.conf with the server
# line below (the kit has no internet, so the laptop is its only reference),
# keep the rest of the distro defaults, then:
#
#   sudo systemctl restart chrony
#   chronyc tracking     # 'Reference ID' should show 172.20.230.162,
#                        # 'System time' offset should drop to < 1 ms

# The recording laptop is the time source on the crane LAN.
server 172.20.230.162 iburst minpoll 2 maxpoll 6

# Always allow stepping the clock, not just at boot: the offset can be
# several seconds and slewing that out would take hours.
makestep 1.0 -1

driftfile /var/lib/chrony/drift
