seed: 42
device: cuda:0
num_steps_per_env: 4
max_iterations: 5000
empirical_normalization: false
obs_groups: {}
clip_actions: null
save_interval: 10
experiment_name: crane_pointcloud
run_name: ''
logger: tensorboard
neptune_project: null
wandb_project: null
resume: false
load_run: null
load_checkpoint: null
class_name: OnPolicyRunner
policy:
  class_name: rsl_rl.modules.PointNetActorCritic
  init_noise_std: 1.0
  noise_std_type: scalar
  actor_obs_normalization: {}
  critic_obs_normalization: {}
  actor_hidden_dims:
  - 128
  - 64
  critic_hidden_dims:
  - 128
  - 64
  activation: elu
  norm_type: batchnorm
  encoder_lr_scale: 0.2
algorithm:
  class_name: PPO
  num_learning_epochs: 5
  num_mini_batches: 4
  learning_rate: 0.0003
  schedule: adaptive
  gamma: 0.99
  lam: 0.95
  entropy_coef: 0.01
  desired_kl: 0.01
  max_grad_norm: 1.0
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.2
  normalize_advantage_per_mini_batch: false
  rnd_cfg: null
  symmetry_cfg: null
